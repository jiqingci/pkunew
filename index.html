<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北 大 侠 客 行</title>
  <link href="https://fonts.googleapis.com/css?family=Noto+Sans+SC:300,700&display=swap&subset=chinese-simplified" rel="stylesheet">
  <style>
    /* —— 参考 Ancientwood/xkx (ancientwood.github.io/xkx) 的 UI 语言 ——
       楷体古风 / 白底黑字 / 可切夜色金链 / 居中窄列 / 顶底固定栏 / 隐藏滚动条 */

    ::-webkit-scrollbar { display: none; }

    html, body { height: 100%; }
    body {
      font-family: Kaiti, "Noto Sans SC", "STKaiti", "PingFang SC", sans-serif;
      font-weight: lighter;
      background: #FFFFFF;
      margin: 0;
      overflow: hidden;
      transition: background 0.6s, color 0.6s;
    }
    body.dark { background: #000; color: #FFFFFF; }

    /* 顶部固定标题（致敬 xkx 的 h3.written-in-ink） */
    .topbar {
      font-size: 9pt;
      font-family: Kaiti, "Noto Sans SC";
      text-align: center;
      font-weight: 700;
      position: fixed;
      display: block;
      width: 100%;
      margin: 0;
      padding: 6px 0;
      top: 0;
      left: 0;
      background: #FFFFFF;
      z-index: 5;
      transition: background 0.6s;
    }
    .topbar a { color: #D50303; text-decoration: none; }
    .dark .topbar { background: #000; }
    .dark .topbar a { color: #cc8f1a; }
    .topbar .sep { color: #ccc; padding: 0 6px; }
    .dark .topbar .sep { color: #444; }

    /* 右上角操作（致敬 xkx 的 #controls，竖线分隔） */
    #controls {
      z-index: 6;
      font-size: 9pt;
      text-align: center;
      padding-bottom: 6px;
      position: fixed;
      right: 14px;
      top: 4px;
      user-select: none;
      background: #FFFFFF;
      transition: color 0.6s, background 0.6s;
    }
    #controls a {
      color: #D50303;
      text-decoration: none;
      cursor: pointer;
      font-weight: 700;
      font-family: Kaiti, "Noto Sans SC";
    }
    #controls a:hover { color: #FC0505; transition: color 0.6s; }
    #controls > *:not(:last-child):after { content: " | "; color: #ccc; }
    .dark #controls { background: #000; }
    .dark #controls a { color: #cc8f1a; }
    .dark #controls a:hover { color: #FFFFFF; }
    .dark #controls > *:not(:last-child):after { color: #444; }

    @media screen and (max-width: 980px) {
      #controls { z-index: 2; padding-top: 24px; top: 0; left: 0; right: 0; background: transparent; }
      .dark #controls { background: transparent; }
    }

    /* 主滚动外壳 */
    .outerContainer {
      position: absolute;
      display: block;
      margin: 0;
      padding: 0;
      -webkit-overflow-scrolling: touch;
      overflow-y: scroll;
      overflow-x: hidden;
      height: 100%;
      width: 100%;
      top: 0;
      left: 0;
    }

    /* MUD 主区：随窗口拉伸（仅在超宽屏限到 1400px 居中，避免单行过长难以阅读） */
    .container {
      display: block;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 3em 14px 8.5em;
      background: #FFFFFF;
      transition: background 0.6s;
    }
    .dark .container { background: #000; }

    /* MUD 输出区：必须等宽字体，否则 ASCII 地图错位
       SimSun/NSimSun (中易宋体) 在 Windows 上是 ASCII=半宽 / CJK=全宽 的标准组合，
       PKUXKX 的地图就是按这个比例画的 */
    #story {
      font-family: "Sarasa Mono SC", NSimSun, SimSun, "新宋体", "宋体",
                   "Cascadia Mono", Consolas, "Courier New", monospace;
      font-size: 14px;
      color: #151515;
      line-height: 1.45;
      font-weight: normal;
      white-space: pre-wrap;
      word-break: keep-all;
      overflow-wrap: normal;
      transition: color 0.6s;
    }
    .dark #story { color: #d4d4d4; }
    /* 系统提示 / 命令回显 仍可用古风字体，与 MUD 主体区分 */
    #story .system, #story .echo {
      font-family: Kaiti, "Noto Sans SC", "STKaiti", "PingFang SC", sans-serif;
      font-weight: lighter;
    }

    #story .echo {
      display: block;
      color: #D50303;
      font-weight: 700;
      padding-top: 0.4em;
    }
    .dark #story .echo { color: #cc8f1a; }
    #story .echo::before { content: "▸ "; }

    #story .system {
      display: block;
      color: #999;
      font-style: italic;
      text-align: center;
      padding: 0.3em 0;
      font-size: 11pt;
    }
    .dark #story .system { color: #777; }

    /* 底部固定区（致敬 xkx .foot：白米纸色 / 夜色深底） */
    .foot {
      width: 100%;
      position: fixed;
      bottom: 0;
      left: 0;
      background: #FFFEFA;
      border-top: 1px solid #eee;
      padding: 8px 14px 6px;
      z-index: 5;
      transition: background 0.6s, border-color 0.6s;
    }
    .dark .foot { background: #0a0a0a; border-top-color: #1c1c1c; }

    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }
    .prompt-mark {
      color: #D50303;
      font-weight: 700;
      font-family: Kaiti, "Noto Sans SC";
      font-size: 14pt;
      user-select: none;
    }
    .dark .prompt-mark { color: #cc8f1a; }

    #input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: #151515;
      font-family: Kaiti, "Noto Sans SC", sans-serif;
      font-size: 13pt;
      padding: 4px 0;
      transition: color 0.6s;
    }
    .dark #input { color: #FFFFFF; }
    #input::placeholder { color: #bbb; font-style: italic; }
    .dark #input::placeholder { color: #555; }

    /* 底部动作链接条（致敬 xkx 底部 【侠】【驿】【舆】 风格） */
    .nav-row {
      text-align: center;
      font-family: Kaiti, "Noto Sans SC";
      font-size: 11pt;
      line-height: 1.6em;
      color: #515C6B;
      padding-top: 4px;
    }
    .nav-row a {
      color: #515C6B;
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
      padding: 0 1px;
      transition: color 0.6s;
    }
    .nav-row a:hover { color: #D50303; }
    .nav-row a[disabled] { color: #ccc; pointer-events: none; }
    .dark .nav-row, .dark .nav-row a { color: #888; }
    .dark .nav-row a:hover { color: #cc8f1a; }
    .dark .nav-row a[disabled] { color: #333; }

    /* 设置浮层（致敬 xkx 的浮窗 #map_lxsz 风格） */
    .modal-mask {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.18);
      z-index: 9;
    }
    .modal-mask.open { display: block; }
    .dark .modal-mask { background: rgba(0,0,0,0.55); }

    .modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #FFFEFA;
      border: 1px solid #ddd;
      padding: 22px 26px;
      min-width: 320px;
      z-index: 10;
      font-family: Kaiti, "Noto Sans SC", sans-serif;
      box-shadow: 0 6px 24px rgba(0,0,0,0.08);
    }
    .modal.open { display: block; }
    .dark .modal { background: #0e0e0e; border-color: #333; box-shadow: 0 6px 24px rgba(0,0,0,0.6); }
    .modal h2 {
      text-align: center;
      font-family: Kaiti, "Noto Sans SC", Georgia, serif;
      color: #010101;
      margin: 0 0 12px;
      font-size: 14pt;
      font-weight: lighter;
    }
    .dark .modal h2 { color: #FFF; }
    .modal label {
      display: block;
      font-size: 10pt;
      color: #888;
      margin: 10px 0 4px;
    }
    .modal input {
      width: 100%;
      padding: 6px 8px;
      border: none;
      border-bottom: 1px solid #ccc;
      background: transparent;
      color: #151515;
      font-family: inherit;
      font-size: 12pt;
      outline: none;
      box-sizing: border-box;
    }
    .modal input:focus { border-bottom-color: #D50303; }
    .dark .modal input { color: #FFF; border-bottom-color: #444; }
    .dark .modal input:focus { border-bottom-color: #cc8f1a; }
    .modal-actions {
      text-align: center;
      padding-top: 18px;
      font-size: 12pt;
    }
    .modal-actions a {
      color: #D50303;
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
      margin: 0 6px;
    }
    .modal-actions a.muted { color: #888; }
    .dark .modal-actions a { color: #cc8f1a; }
    .dark .modal-actions a.muted { color: #666; }

    /* 状态浮窗（左上小框，结构上致敬 #map_lxsz） */
    #status-panel {
      position: fixed;
      background-color: rgba(128,128,128,0.07);
      left: 10px;
      top: 36px;
      display: none;
      margin: 5px;
      padding: 6px 10px;
      font-family: Kaiti, "Noto Sans SC", sans-serif;
      font-size: 10pt;
      max-width: 220px;
      border-radius: 2px;
      z-index: 3;
      color: #555;
      white-space: pre-wrap;
    }
    .dark #status-panel { color: #aaa; background-color: rgba(255,255,255,0.05); }
    @media (max-width: 800px) { #status-panel { display: none !important; } }

    /* —— ANSI 16 色（白底素雅版） —— */
    .fg30 { color: #2e2e2e; } .fg31 { color: #b22222; }
    .fg32 { color: #2a7a2a; } .fg33 { color: #a07820; }
    .fg34 { color: #2050a0; } .fg35 { color: #8a3a8a; }
    .fg36 { color: #2080a0; } .fg37 { color: #888888; }
    .bfg30 { color: #555555; } .bfg31 { color: #D50303; }
    .bfg32 { color: #1a8a1a; } .bfg33 { color: #c89820; }
    .bfg34 { color: #2070d0; } .bfg35 { color: #c050c0; }
    .bfg36 { color: #20a0c0; } .bfg37 { color: #404040; }
    .bg40 { background: #e8e8e8; } .bg41 { background: #ffe0e0; }
    .bg42 { background: #e0ffe0; } .bg43 { background: #fff7d0; }
    .bg44 { background: #e0e8ff; } .bg45 { background: #ffe0ff; }
    .bg46 { background: #e0f8ff; } .bg47 { background: #dddddd; }

    /* —— ANSI 16 色（夜色高亮版） —— */
    .dark .fg30 { color: #888; }   .dark .fg31 { color: #ff6b6b; }
    .dark .fg32 { color: #4ee06b; } .dark .fg33 { color: #f5e542; }
    .dark .fg34 { color: #5ca7ff; } .dark .fg35 { color: #ff66ff; }
    .dark .fg36 { color: #4ee0e0; } .dark .fg37 { color: #cccccc; }
    .dark .bfg30 { color: #aaa; }   .dark .bfg31 { color: #ff8585; }
    .dark .bfg32 { color: #6ef07e; } .dark .bfg33 { color: #f7e958; }
    .dark .bfg34 { color: #7eb8ff; } .dark .bfg35 { color: #ff8aff; }
    .dark .bfg36 { color: #6eecf2; } .dark .bfg37 { color: #FFFFFF; }
    .dark .bg40 { background: #2a2a2a; } .dark .bg41 { background: #4d1d1d; }
    .dark .bg42 { background: #1d4d1d; } .dark .bg43 { background: #4d471d; }
    .dark .bg44 { background: #1d224d; } .dark .bg45 { background: #4d1d4d; }
    .dark .bg46 { background: #1d404d; } .dark .bg47 { background: #555; }

    .bold { font-weight: 700; }
    .underline { text-decoration: underline; }
    .blink { animation: blink 1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }

    /* —— MXP 元素 —— */
    /* 可点击的 MXP <SEND>：点一下把命令填入命令行 */
    .mxp-send {
      color: #D50303;
      cursor: pointer;
      text-decoration: underline dotted;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      font-weight: 700;
      transition: color 0.3s;
    }
    .mxp-send:hover {
      color: #FC0505;
      text-decoration-style: solid;
      background: rgba(213, 3, 3, 0.06);
    }
    .dark .mxp-send { color: #cc8f1a; }
    .dark .mxp-send:hover { color: #ffd673; background: rgba(204, 143, 26, 0.12); }
    /* 普通 MXP 超链接 <A href> */
    .mxp-link {
      color: #2070d0;
      text-decoration: underline;
      cursor: pointer;
    }
    .dark .mxp-link { color: #5ca7ff; }
    .mxp-high { font-weight: 700; }

    /* 传输日记面板（大尺寸 modal） */
    .modal.modal-large {
      width: min(900px, 92vw);
      max-height: 82vh;
      padding: 18px 22px;
    }
    .modal.modal-large.open { display: flex; flex-direction: column; }
    .log-actions {
      padding: 4px 0 8px;
      font-size: 10pt;
      border-bottom: 1px solid #eee;
    }
    .dark .log-actions { border-bottom-color: #2a2a2a; }
    .log-actions a {
      color: #888;
      cursor: pointer;
      padding: 0 8px;
      text-decoration: none;
      font-weight: 700;
    }
    .log-actions a:hover { color: #D50303; }
    .dark .log-actions a:hover { color: #cc8f1a; }
    #log-list {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      font-family: Consolas, "Cascadia Code", "Source Code Pro", monospace;
      font-size: 11pt;
      line-height: 1.45em;
      background: rgba(0,0,0,0.025);
      padding: 8px 10px;
      border-radius: 3px;
      margin: 8px 0 4px;
      min-height: 360px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .dark #log-list { background: rgba(255,255,255,0.04); }
    #log-list::-webkit-scrollbar { display: block; width: 8px; }
    #log-list::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
    .dark #log-list::-webkit-scrollbar-thumb { background: #444; }
    .log-row {
      padding: 1px 0;
      border-bottom: 1px solid rgba(0,0,0,0.04);
    }
    .dark .log-row { border-bottom-color: rgba(255,255,255,0.04); }
    .log-row .ts { color: #aaa; margin-right: 6px; font-size: 9pt; }
    .log-row .dir { font-weight: 700; margin-right: 4px; display: inline-block; min-width: 14px; }
    .log-row.recv .dir { color: #2a7a2a; }
    .log-row.send .dir { color: #D50303; }
    .log-row.telnet { color: #2070d0; }
    .log-row.event  { color: #888; font-style: italic; }
    .dark .log-row.recv .dir { color: #4ee06b; }
    .dark .log-row.send .dir { color: #ff8585; }
    .dark .log-row.telnet     { color: #5ca7ff; }
    .dark .log-row.event      { color: #777; }

    /* MXP 协商成功后顶栏的小指示 */
    #mxp-indicator {
      display: none;
      margin-left: 6px;
      font-size: 9pt;
      color: #2a7a2a;
      font-weight: 700;
    }
    .dark #mxp-indicator { color: #4ee06b; }
    #mxp-indicator.on { display: inline; }
  </style>
</head>
<body>
  <h3 class="topbar">北 大 侠 客 行<span class="sep">·</span><a id="status-text">未连接</a><span id="mxp-indicator" title="MXP 协议已启用，可点击红色链接">[MXP]</span></h3>

  <div id="controls">
    <a id="ctrl-theme">夜</a>
    <a id="ctrl-settings">设</a>
    <a id="ctrl-clear">清</a>
  </div>

  <div id="status-panel"></div>

  <div class="outerContainer" id="scroller">
    <div class="container">
      <div id="story"></div>
    </div>
  </div>

  <div class="foot">
    <div class="input-row">
      <span class="prompt-mark">▸</span>
      <input id="input" type="text" autocomplete="off" spellcheck="false"
             placeholder="在此输入命令…  ↑/↓ 浏览历史   ;   分隔多条">
    </div>
    <div class="nav-row">
      <a id="nav-connect">【连】</a>
      <a id="nav-disconnect">【断】</a>
      <a id="nav-look" data-cmd="look">【观】</a>
      <a id="nav-score" data-cmd="score">【己】</a>
      <a id="nav-inv"   data-cmd="i">【囊】</a>
      <a id="nav-who"   data-cmd="who">【众】</a>
      <a id="nav-clear">【清】</a>
      <a id="nav-log">【志】</a>
      <a id="nav-theme">【夜】</a>
      <a id="nav-settings">【设】</a>
    </div>
  </div>

  <div class="modal-mask" id="modal-mask"></div>
  <div class="modal modal-large" id="modal-log">
    <h2>传 输 日 记</h2>
    <div class="log-actions">
      <a id="log-clear">清空</a>
      <a id="log-copy">复制全部</a>
      <a id="log-export">导出文件</a>
      <span id="log-stats" style="float:right;color:#999;font-size:9pt"></span>
    </div>
    <div id="log-list"></div>
    <div class="modal-actions">
      <a id="log-close" class="muted">【闭】</a>
    </div>
  </div>
  <div class="modal" id="modal-settings">
    <h2>桥 接 设 置</h2>
    <label>WebSocket 地址</label>
    <input id="server" type="text" value="ws://localhost:8765" placeholder="ws://host:port">
    <label>命令字体</label>
    <input id="font-pref" type="text" placeholder="留空使用默认楷体；可填 monospace">
    <div class="modal-actions">
      <a id="settings-save">【存】</a>
      <a id="settings-close" class="muted">【闭】</a>
    </div>
  </div>

  <script>
  (function () {
    const $ = id => document.getElementById(id);
    const story = $('story'), inp = $('input'), scroller = $('scroller'),
          statusText = $('status-text'), modal = $('modal-settings'), mask = $('modal-mask');

    let ws = null;
    const history = [];
    let historyIdx = -1;
    let pendingInput = '';

    // —— 偏好持久化 —— //
    const prefs = {
      get(k, d) { try { return localStorage.getItem('xkx.' + k) ?? d; } catch (_) { return d; } },
      set(k, v) { try { localStorage.setItem('xkx.' + k, v); } catch (_) {} }
    };
    // 优先级：URL ?ws= 参数（Electron 注入）> localStorage 记忆值 > 默认值
    const urlParams = new URLSearchParams(window.location.search);
    const urlWs   = urlParams.get('ws');
    const urlAuto = urlParams.get('autoconnect') === '1';
    $('server').value = urlWs || prefs.get('server', 'ws://localhost:8765');
    $('font-pref').value = prefs.get('font', '');
    if (prefs.get('theme', 'light') === 'dark') document.body.classList.add('dark');
    applyFont(prefs.get('font', ''));

    function applyFont(v) {
      if (v && v.trim()) {
        story.style.fontFamily = v + ', Kaiti, "Noto Sans SC", sans-serif';
        inp.style.fontFamily = v + ', Kaiti, "Noto Sans SC", sans-serif';
      } else {
        story.style.fontFamily = '';
        inp.style.fontFamily = '';
      }
    }

    function setStatus(state, label) {
      statusText.textContent = label;
      statusText.dataset.state = state;
      statusText.style.color = state === 'connected' ? '' :
                                state === 'connecting' ? '#a07820' :
                                state === 'error' ? '#a02a2a' : '';
    }

    function atBottom() {
      return scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 30;
    }
    function append(html) {
      const stick = atBottom();
      story.insertAdjacentHTML('beforeend', html);
      if (stick) scroller.scrollTop = scroller.scrollHeight;
    }
    function appendSystem(text) {
      append('<span class="system">' + escapeHtml(text) + '</span>');
    }
    function appendEcho(text) {
      append('<span class="echo">' + escapeHtml(text) + '</span>');
    }
    function escapeHtml(s) {
      return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    }

    // —— ANSI 解析（状态跨消息保留） —— //
    const ansi = { bold: false, fg: null, bg: null, underline: false, blink: false };
    function ansiClasses() {
      const cls = [];
      if (ansi.fg !== null) cls.push((ansi.bold ? 'bfg' : 'fg') + ansi.fg);
      else if (ansi.bold)   cls.push('bold');
      if (ansi.bg !== null) cls.push('bg' + ansi.bg);
      if (ansi.underline)   cls.push('underline');
      if (ansi.blink)       cls.push('blink');
      return cls;
    }
    function applyAnsiCodes(codes) {
      if (codes.length === 0) codes = [0];
      for (const c of codes) {
        if (c === 0)      { ansi.bold = false; ansi.fg = null; ansi.bg = null;
                            ansi.underline = false; ansi.blink = false; }
        else if (c === 1) ansi.bold = true;
        else if (c === 4) ansi.underline = true;
        else if (c === 5) ansi.blink = true;
        else if (c === 22) ansi.bold = false;
        else if (c === 24) ansi.underline = false;
        else if (c === 25) ansi.blink = false;
        else if (c === 39) ansi.fg = null;
        else if (c === 49) ansi.bg = null;
        else if (c >= 30 && c <= 37) ansi.fg = c;
        else if (c >= 40 && c <= 47) ansi.bg = c;
        else if (c >= 90 && c <= 97) { ansi.fg = c - 60; ansi.bold = true; }
      }
    }

    // —— MXP 状态与解析 —— //
    // 模式：'open' (默认，仅基础格式) / 'secure' (允许 SEND/A) / 'locked' (不解析)
    const mxp = { mode: 'open', enabled: false };
    function applyMxpMode(code) {
      // CSI z 子集，按 MXP 规范：0 OPEN, 1 SECURE, 2 LOCKED, 3 RESET, 4 TEMP_SECURE,
      // 5 LOCK_OPEN, 6 LOCK_SECURE, 7 LOCK_LOCKED
      switch (code) {
        case 0: case 5:           mxp.mode = 'open';   break;
        case 1: case 4: case 6:   mxp.mode = 'secure'; break;
        case 2: case 7:           mxp.mode = 'locked'; break;
        case 3:                   mxp.mode = 'open';   break;
      }
      if (!mxp.enabled) { mxp.enabled = true; document.getElementById('mxp-indicator').classList.add('on'); }
    }

    // MXP 实体：&lt; &gt; &amp; &quot; &#NNN;
    function decodeMxpEntities(s) {
      return s.replace(/&(lt|gt|amp|quot|apos|#\d+);/g, (full, name) => {
        if (name === 'lt')   return '<';
        if (name === 'gt')   return '>';
        if (name === 'amp')  return '&';
        if (name === 'quot') return '"';
        if (name === 'apos') return "'";
        if (name[0] === '#') { const n = parseInt(name.slice(1), 10); return n ? String.fromCharCode(n) : full; }
        return full;
      });
    }
    function escapeAttr(s) {
      return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    // 解析 MXP 标签的属性串：支持位置参数 "x" 与命名属性 key=val
    function parseMxpAttrs(s) {
      const attrs = {};
      let m = s.match(/^\s*"([^"]*)"/);
      if (m) { attrs._pos = m[1]; s = s.slice(m[0].length); }
      else { m = s.match(/^\s*'([^']*)'/);
        if (m) { attrs._pos = m[1]; s = s.slice(m[0].length); } }
      const re = /(\w+)\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/g;
      while ((m = re.exec(s))) {
        const v = m[2] !== undefined ? m[2] : (m[3] !== undefined ? m[3] : m[4]);
        attrs[m[1].toLowerCase()] = v;
      }
      return attrs;
    }

    // MXP 颜色名 → CSS 颜色（支持 #rgb / #rrggbb 直接传入）
    const MXP_COLORS = {
      black: '#000', red: '#cd3131', green: '#0dbc79', yellow: '#a07820',
      blue: '#2050a0', magenta: '#bc3fbc', cyan: '#11a8cd', white: '#fff',
      gray: '#888', grey: '#888', silver: '#c0c0c0', maroon: '#800000',
      olive: '#808000', lime: '#00ff00', aqua: '#00ffff', teal: '#008080',
      navy: '#000080', purple: '#800080', fuchsia: '#ff00ff'
    };
    function cssColor(name) {
      if (!name) return '';
      const n = String(name).toLowerCase().trim();
      if (MXP_COLORS[n]) return MXP_COLORS[n];
      if (/^#[0-9a-f]{3}([0-9a-f]{3})?$/.test(n)) return n;
      return '';
    }

    // 渲染单个 MXP 标签为 HTML 片段
    function renderMxpTag(tag, isClose, attrStr) {
      const allowSecure = mxp.mode !== 'locked'; // 我们对 SEND 一律允许（除非显式 locked）
      const attrs = isClose ? {} : parseMxpAttrs(attrStr);
      switch (tag) {
        case 'send': {
          if (!allowSecure) return '';
          if (isClose) return '</a>';
          // 命令优先级：href > 位置参数 > （fallback 由点击时取 textContent 完成）
          const cmdRaw = attrs.href || attrs._pos || '';
          const cmd = cmdRaw.split('|')[0];
          const hint = (attrs.hint || cmd || '').split('|')[0];
          let h = '<a class="mxp-send"';
          if (cmd)  h += ' data-cmd="' + escapeAttr(cmd) + '"';
          if (hint) h += ' title="' + escapeAttr(hint) + '"';
          // prompt 属性：填入而不发送（恰好是我们默认行为，标记一下方便扩展）
          if ('prompt' in attrs) h += ' data-prompt="1"';
          return h + '>';
        }
        case 'a': case 'hyperlink': {
          if (!allowSecure) return '';
          if (isClose) return '</a>';
          if (attrs.xch_cmd) return '<a class="mxp-send" data-cmd="' + escapeAttr(attrs.xch_cmd) + '">';
          const url = attrs.href || attrs._pos || '#';
          return '<a class="mxp-link" href="' + escapeAttr(url) + '" target="_blank" rel="noopener">';
        }
        case 'b': case 'bold': case 'strong':
          return isClose ? '</b>' : '<b>';
        case 'i': case 'italic': case 'em':
          return isClose ? '</i>' : '<i>';
        case 'u': case 'underline':
          return isClose ? '</u>' : '<u>';
        case 's': case 'strike': case 'strikeout':
          return isClose ? '</s>' : '<s>';
        case 'h': case 'high':
          return isClose ? '</span>' : '<span class="mxp-high">';
        case 'br':   return '<br>';
        case 'hr':   return '<hr>';
        case 'small':return isClose ? '</small>' : '<small>';
        case 'tt':   return isClose ? '</code>' : '<code>';
        case 'nobr': return isClose ? '</span>' : '<span style="white-space:nowrap">';
        case 'p':    return isClose ? '</p>' : '<p>';
        case 'h1': case 'h2': case 'h3': case 'h4': case 'h5': case 'h6':
          return isClose ? '</' + tag + '>' : '<' + tag + '>';
        case 'c': case 'color': {
          if (isClose) return '</span>';
          const fg = cssColor(attrs.fore || attrs._pos);
          const bg = cssColor(attrs.back);
          const styles = [];
          if (fg) styles.push('color:' + fg);
          if (bg) styles.push('background:' + bg);
          return '<span style="' + styles.join(';') + '">';
        }
        case 'font': {
          if (isClose) return '</span>';
          const fg = cssColor(attrs.color || attrs.fore);
          const bg = cssColor(attrs.back);
          const styles = [];
          if (fg) styles.push('color:' + fg);
          if (bg) styles.push('background:' + bg);
          if (attrs.size) { const sz = parseInt(attrs.size, 10); if (sz > 0 && sz < 100) styles.push('font-size:' + sz + 'pt'); }
          return '<span style="' + styles.join(';') + '">';
        }
        // MXP 元素定义/版本/选项类标签：吃掉不显示
        case 'expire': case 'version': case 'support': case 'option':
        case 'var': case 'mxp': case 'reset': case 'element': case 'el':
        case 'attlist': case 'at': case 'frame': case 'dest': case 'gauge': case 'stat':
          return '';
        default:
          return ''; // 未知标签：吞掉，避免污染显示
      }
    }

    function wrap(text) {
      if (!text) return '';
      const decoded = mxp.enabled ? decodeMxpEntities(text) : text;
      const esc = escapeHtml(decoded);
      const cls = ansiClasses();
      return cls.length ? `<span class="${cls.join(' ')}">${esc}</span>` : esc;
    }

    // 同时识别 ANSI 转义（CSI ... 字母）与 MXP 标签
    function renderChunk(text) {
      text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      let html = '';
      const re = /\x1b\[([0-9;]*)([a-zA-Z])|<(\/?)([A-Za-z][\w-]*)\b([^>]*)>/g;
      let last = 0, m;
      while ((m = re.exec(text)) !== null) {
        if (m.index > last) html += wrap(text.slice(last, m.index));
        if (m[2]) {
          // ANSI / MXP 模式切换 (CSI ... letter)
          if (m[2] === 'm') {
            const codes = m[1].length ? m[1].split(';').map(n => parseInt(n, 10) || 0) : [0];
            applyAnsiCodes(codes);
          } else if (m[2] === 'z') {
            applyMxpMode(parseInt(m[1], 10) || 0);
          }
          // 其它 CSI（光标移动等）静默吞掉
        } else {
          // MXP 标签
          html += renderMxpTag(m[4].toLowerCase(), m[3] === '/', m[5] || '');
        }
        last = m.index + m[0].length;
      }
      if (last < text.length) html += wrap(text.slice(last));
      append(html);
    }

    // —— 连接 —— //
    function connect() {
      const url = $('server').value.trim();
      if (!url) { appendSystem('请先在【设】中填写 WebSocket 地址'); return; }
      if (ws && ws.readyState <= 1) { appendSystem('已经连接，无需重复连接'); return; }
      prefs.set('server', url);
      setStatus('connecting', '连接中…');
      appendSystem('正在连接 ' + url);
      pushLog({ dir: 'meta', kind: 'event', desc: '正在连接 ' + url });
      try { ws = new WebSocket(url); }
      catch (e) { setStatus('disconnected', '未连接'); appendSystem('连接失败：' + e.message); return; }
      ws.binaryType = 'arraybuffer';
      ws.onopen = () => {
        setStatus('connected', '已连接');
        appendSystem('连接成功');
        pushLog({ dir: 'meta', kind: 'event', desc: 'WebSocket 已连接' });
        inp.focus();
      };
      ws.onmessage = ev => {
        // 二进制 ws 消息 = 桥接发的元数据 (JSON)；文本 ws 消息 = MUD 数据
        if (ev.data instanceof ArrayBuffer) {
          let metaText = '';
          try { metaText = new TextDecoder('utf-8').decode(new Uint8Array(ev.data)); } catch (_) {}
          // 元数据 JSON：尝试解析；解析失败回落当作文本数据
          try {
            const meta = JSON.parse(metaText);
            handleMeta(meta);
            return;
          } catch (_) { /* 非 JSON，按文本处理 */ }
          pushLog({ dir: 'recv', kind: 'data', text: metaText });
          renderChunk(metaText);
          return;
        }
        const text = String(ev.data);
        pushLog({ dir: 'recv', kind: 'data', text });
        renderChunk(text);
      };
      ws.onerror = () => {
        appendSystem('WebSocket 出现错误（地址不可达或桥接未启动？）');
        pushLog({ dir: 'meta', kind: 'error', desc: 'WebSocket 错误' });
      };
      ws.onclose = ev => {
        setStatus('disconnected', '已断开');
        appendSystem('连接已关闭' + (ev && ev.code ? `（code=${ev.code}）` : ''));
        pushLog({ dir: 'meta', kind: 'event', desc: 'WebSocket 已关闭 code=' + (ev && ev.code) });
      };
    }
    function disconnect() { if (ws) { ws.close(); ws = null; } }
    function send(line) {
      if (!ws || ws.readyState !== 1) { appendSystem('尚未连接到服务器'); return; }
      const out = line + '\n';
      ws.send(out);
      pushLog({ dir: 'send', kind: 'data', text: out });
    }
    function submit() {
      const raw = inp.value;
      if (!raw) {
        // 空回车 = 重复上一条指令；尚未发过任何命令时退化为发空行（用于初始登录确认）
        if (history.length > 0) {
          const last = history[history.length - 1];
          appendEcho(last);
          send(last);
        } else {
          appendEcho('');
          send('');
        }
        return;
      }
      if (history[history.length - 1] !== raw) history.push(raw);
      historyIdx = history.length;
      const parts = raw.split(';').map(s => s.trim()).filter(s => s.length);
      for (const cmd of parts) { appendEcho(cmd); send(cmd); }
      inp.value = '';
      pendingInput = '';
    }

    // —— 传输日记 —— //
    const MAX_LOG = 2000;
    const logStore = [];
    const logPanel = $('modal-log');
    function pushLog(entry) {
      entry.ts = entry.ts || Date.now();
      logStore.push(entry);
      if (logStore.length > MAX_LOG) logStore.splice(0, logStore.length - MAX_LOG);
      if (logPanel.classList.contains('open')) renderLogIncremental(entry);
      updateLogStats();
    }
    // 桥接发来的元数据：{type:'telnet'|'event', dir, kind, desc, ts}
    function handleMeta(meta) {
      if (!meta || !meta.type) return;
      if (meta.type === 'event' && meta.kind === 'mxp') {
        // 桥接通报 MXP 协商成功
        mxp.enabled = true;
        $('mxp-indicator').classList.add('on');
      }
      pushLog({
        ts: meta.ts || Date.now(),
        dir: meta.dir || 'meta',
        kind: meta.type === 'telnet' ? 'telnet' : 'event',
        desc: meta.desc || ''
      });
    }
    // 不可见字符可视化：方便用户看到 ESC、回车、IAC
    function visualize(s) {
      return String(s)
        .replace(/\x1b/g, '␛')
        .replace(/\xff/g, '⁅FF⁆')
        .replace(/\r/g, '␍')
        .replace(/\t/g, '␉')
        .replace(/\x00/g, '␀');
    }
    function renderLogRow(entry) {
      const d = new Date(entry.ts);
      const ts = String(d.getHours()).padStart(2,'0') + ':' +
                 String(d.getMinutes()).padStart(2,'0') + ':' +
                 String(d.getSeconds()).padStart(2,'0') + '.' +
                 String(d.getMilliseconds()).padStart(3,'0');
      const dirSym = entry.dir === 'send' ? '→' : entry.dir === 'recv' ? '←' : '⚙';
      let body;
      if (entry.kind === 'data') {
        body = escapeHtml(visualize(entry.text || ''));
      } else {
        body = escapeHtml(entry.desc || '');
      }
      return `<div class="log-row ${entry.kind} ${entry.dir}"><span class="ts">${ts}</span><span class="dir">${dirSym}</span>${body}</div>`;
    }
    function renderLogIncremental(entry) {
      const list = $('log-list');
      const wasAtBottom = list.scrollTop + list.clientHeight >= list.scrollHeight - 30;
      list.insertAdjacentHTML('beforeend', renderLogRow(entry));
      if (wasAtBottom) list.scrollTop = list.scrollHeight;
    }
    function renderLogFull() {
      $('log-list').innerHTML = logStore.map(renderLogRow).join('');
      $('log-list').scrollTop = $('log-list').scrollHeight;
    }
    function updateLogStats() {
      const stats = $('log-stats');
      if (!stats) return;
      const recv = logStore.filter(e => e.dir === 'recv').length;
      const send = logStore.filter(e => e.dir === 'send').length;
      const tel  = logStore.filter(e => e.kind === 'telnet').length;
      stats.textContent = `共 ${logStore.length} 条 · 收 ${recv} · 发 ${send} · IAC ${tel}`;
    }
    function openLog() {
      logPanel.classList.add('open');
      mask.classList.add('open');
      renderLogFull();
      updateLogStats();
    }
    function closeLog() {
      logPanel.classList.remove('open');
      // 仅在没有其它 modal 打开时收起遮罩
      if (!modal.classList.contains('open')) mask.classList.remove('open');
    }
    function exportLogText() {
      return logStore.map(e => {
        const d = new Date(e.ts);
        const ts = d.toISOString();
        const dir = e.dir === 'send' ? '→' : e.dir === 'recv' ? '←' : '⚙';
        const body = e.kind === 'data' ? JSON.stringify(e.text) : (e.desc || '');
        return `${ts} ${dir} [${e.kind || ''}] ${body}`;
      }).join('\n');
    }

    // —— 主题与设置 —— //
    function toggleTheme() {
      document.body.classList.toggle('dark');
      prefs.set('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    }
    function openSettings() { modal.classList.add('open'); mask.classList.add('open'); $('server').focus(); }
    function closeSettings() {
      modal.classList.remove('open');
      if (!logPanel.classList.contains('open')) mask.classList.remove('open');
    }
    function saveSettings() {
      prefs.set('server', $('server').value.trim());
      const f = $('font-pref').value.trim();
      prefs.set('font', f);
      applyFont(f);
      closeSettings();
      appendSystem('设置已保存');
    }

    // —— 事件绑定 —— //
    $('nav-connect').addEventListener('click', connect);
    $('nav-disconnect').addEventListener('click', disconnect);
    $('nav-clear').addEventListener('click', () => { story.innerHTML = ''; });
    $('nav-theme').addEventListener('click', toggleTheme);
    $('nav-settings').addEventListener('click', openSettings);
    $('nav-log').addEventListener('click', openLog);
    $('ctrl-clear').addEventListener('click', () => { story.innerHTML = ''; });
    $('ctrl-theme').addEventListener('click', toggleTheme);
    $('ctrl-settings').addEventListener('click', openSettings);
    $('settings-save').addEventListener('click', saveSettings);
    $('settings-close').addEventListener('click', closeSettings);
    $('log-close').addEventListener('click', closeLog);
    $('log-clear').addEventListener('click', () => { logStore.length = 0; renderLogFull(); updateLogStats(); });
    $('log-copy').addEventListener('click', () => {
      const txt = exportLogText();
      const done = () => appendSystem('日记已复制到剪贴板（' + logStore.length + ' 条）');
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done));
      else fallbackCopy(txt, done);
    });
    $('log-export').addEventListener('click', () => {
      const txt = exportLogText();
      const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'pkuxkx-log-' + new Date().toISOString().replace(/[:.]/g,'-').slice(0,-5) + '.txt';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });
    function fallbackCopy(txt, done) {
      const ta = document.createElement('textarea');
      ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done && done(); } finally { document.body.removeChild(ta); }
    }
    mask.addEventListener('click', () => { closeSettings(); closeLog(); });
    statusText.addEventListener('click', () => {
      const s = statusText.dataset.state;
      if (s === 'connected') disconnect(); else connect();
    });

    // 快捷命令按钮
    document.querySelectorAll('.nav-row a[data-cmd]').forEach(el => {
      el.addEventListener('click', () => {
        const cmd = el.dataset.cmd;
        appendEcho(cmd);
        send(cmd);
        inp.focus();
      });
    });

    // —— MXP <SEND> 点击：把命令填入命令行（不立即发送），让玩家可编辑后回车 —— //
    story.addEventListener('click', e => {
      const a = e.target.closest('a.mxp-send');
      if (!a) return;
      e.preventDefault();
      // data-cmd 缺失时（例如 <SEND>north</SEND>）回落到链接文本本身
      const cmd = (a.dataset.cmd && a.dataset.cmd.length) ? a.dataset.cmd : a.textContent.trim();
      inp.value = cmd;
      inp.focus();
      inp.setSelectionRange(cmd.length, cmd.length);
    });

    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
      else if (e.key === 'ArrowUp') {
        if (history.length === 0) return;
        e.preventDefault();
        if (historyIdx === history.length) pendingInput = inp.value;
        historyIdx = Math.max(0, historyIdx - 1);
        inp.value = history[historyIdx];
        setTimeout(() => inp.setSelectionRange(inp.value.length, inp.value.length), 0);
      } else if (e.key === 'ArrowDown') {
        if (history.length === 0) return;
        e.preventDefault();
        historyIdx = Math.min(history.length, historyIdx + 1);
        inp.value = historyIdx === history.length ? pendingInput : history[historyIdx];
      } else if (e.key === 'Escape') {
        if (modal.classList.contains('open')) closeSettings();
        if (logPanel.classList.contains('open')) closeLog();
      }
    });

    // 启动文案：浏览器 vs Electron 桌面
    const inElectron = !!window.pkuxkx && window.pkuxkx.isElectron;
    if (inElectron) {
      appendSystem('北大侠客行 · 桌面客户端 已就绪 (内嵌桥接 → mud.pkuxkx.net:8080 / GBK / MXP)');
      window.pkuxkx.getVersion().then(v => appendSystem('版本 v' + v + '；启动后将后台检查 GitHub 最新发布'));
    } else {
      appendSystem('北大侠客行 · Web 客户端 已就绪 (mud.pkuxkx.net:8080 / GBK / MXP)');
      appendSystem('需先运行本地桥接：node bridge.js   （默认 ws://localhost:8765 → mud.pkuxkx.net:8080）');
    }
    appendSystem('点击底部 【连】 开始游戏；MXP 协商成功后顶栏出现 [MXP]，红色链接可点击填入命令行');
    setStatus('disconnected', '未连接');
    inp.focus();

    // Electron 注入了 ws 端口参数时，自动连接
    if (urlAuto) setTimeout(connect, 200);
  })();
  </script>
</body>
</html>
